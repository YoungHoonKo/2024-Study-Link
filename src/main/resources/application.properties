spring.application.name=project

# MySQL ?????? ?? ??
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/studylink?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA (Java Persistence API) ??
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

jwt.secret=${JWT_SECRET}
#3600000
jwt.accessTokenExpiration = 3600000
jwt.refreshTokenExpiration=1209600000


spring.thymeleaf.prefix=classpath:/templates/
spring.web.resources.static-locations=classpath:/static/

